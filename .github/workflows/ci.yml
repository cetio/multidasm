name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.suite }} (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-latest, ldc-latest]
        suite: [test-amd64, test-mips, test-cil]

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler (${{ matrix.compiler }})
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Run ${{ matrix.suite }} tests
        run: dub test -c ${{ matrix.suite }}
