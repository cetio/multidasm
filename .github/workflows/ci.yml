name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (D ${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-latest, ldc-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler (${{ matrix.compiler }})
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Run tests
        run: dub test
