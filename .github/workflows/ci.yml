name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-latest, ldc-latest]
        suite: [amd64, mips, cil]

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler (${{ matrix.compiler }})
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Cache DUB packages and build cache
        uses: actions/cache@v4
        env:
          DUB_CACHE_KEY: dub-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler }}
        with:
          path: |
            ${{ runner.temp }}/dub/packages
            ${{ runner.temp }}/dub/cache
          key: ${{ env.DUB_CACHE_KEY }}-${{ hashFiles('dub.json', 'dub.selections.json') }}
          restore-keys: |
            ${{ env.DUB_CACHE_KEY }}-

      - name: Run ${{ matrix.suite }} tests
        env:
          DUB_HOME: ${{ runner.temp }}/dub
        run: dub test -c ${{ matrix.suite }}
